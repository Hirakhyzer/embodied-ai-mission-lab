name: Rust Core

on:
  push:
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "rust-core/**"
      - ".github/workflows/rust-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Run example
        run: cargo run --manifest-path rust-core/Cargo.toml --example plan_mission
