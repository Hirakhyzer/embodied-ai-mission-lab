<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="Responsible embodied AI mission workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title{font:800 27px Arial,Helvetica,sans-serif;fill:#0f172a}
      .sub{font:500 14px Arial,Helvetica,sans-serif;fill:#475569}
      .label{font:700 16px Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font:500 12.5px Arial,Helvetica,sans-serif;fill:#475569}
      .arrow{stroke:#7c3aed;stroke-width:3;marker-end:url(#arrow);fill:none}
    </style>
  </defs>
  <rect width="1120" height="430" rx="28" fill="url(#bg)"/>
  <text class="title" x="44" y="54">Responsible Embodied AI Mission Workflow</text>
  <text class="sub" x="44" y="80">Each mission is planned, checked, simulated, explained, and exported before any hardware-facing adapter is considered.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="132" width="168" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="78" y="166">Design Goal</text>
    <text class="small" x="78" y="194">select target or</text>
    <text class="small" x="78" y="212">click grid cell</text>

    <rect x="258" y="132" width="168" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="288" y="166">Plan Route</text>
    <text class="small" x="288" y="194">A* path over</text>
    <text class="small" x="288" y="212">known grid map</text>

    <rect x="468" y="132" width="168" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="498" y="166">Check Safety</text>
    <text class="small" x="498" y="194">obstacle, edge,</text>
    <text class="small" x="498" y="212">battery gates</text>

    <rect x="678" y="132" width="168" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="708" y="166">Simulate Run</text>
    <text class="small" x="708" y="194">step through or</text>
    <text class="small" x="708" y="212">execute mission</text>

    <rect x="888" y="132" width="168" height="92" rx="20" fill="#ffffff"/>
    <text class="label" x="918" y="166">Audit Result</text>
    <text class="small" x="918" y="194">trace, export,</text>
    <text class="small" x="918" y="212">review outcome</text>
  </g>

  <path class="arrow" d="M216 178 L258 178"/>
  <path class="arrow" d="M426 178 L468 178"/>
  <path class="arrow" d="M636 178 L678 178"/>
  <path class="arrow" d="M846 178 L888 178"/>

  <g filter="url(#shadow)">
    <rect x="98" y="294" width="924" height="70" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="label" x="128" y="324">Hardware-readiness checkpoint</text>
    <text class="small" x="128" y="348">Only simulations are supported by default. Physical robots require validated maps, calibrated sensors, emergency-stop handling, operator supervision, and adapter-specific tests.</text>
  </g>
</svg>
